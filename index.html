          notifyButton: { enable: true },

        });
      });
    </script>

    <script>

        await OneSignal.init({
          appId: "YOUR_ONESIGNAL_APP_ID_HERE", // 유저가 가입 후 교체해야 함
          notifyButton: {
            enable: true,
          },
        });
      });
